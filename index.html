<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Розміщення в палатах</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4">
    <h1 class="mb-4">Розміщення в палатах</h1>

    <div class="btn-group mb-4" role="group" aria-label="Головна навігація">
      <button class="btn btn-outline-primary" data-section="rooms">Палати</button>
      <button class="btn btn-outline-primary" data-section="clients">Пацієнти</button>
      <button class="btn btn-primary" data-section="reservations">Розміщення</button>
    </div>

    <div id="message" class="alert alert-success mt-3 d-none" role="alert"></div>

    <section id="rooms" class="section-content d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Палати</h2>
        <button id="new-room-button" class="btn btn-primary">Нова палата</button>
      </div>

      <div id="room-form-container" class="card mb-3 d-none">
        <div class="card-body">
          <form id="room-form" class="row g-3">
            <div class="col-md-4">
              <label for="room-name" class="form-label">Назва</label>
              <input type="text" id="room-name" class="form-control" required>
            </div>
            <div class="col-md-5">
              <label for="room-description" class="form-label">Опис</label>
              <input type="text" id="room-description" class="form-control">
            </div>
            <div class="col-md-3 d-flex align-items-end gap-2">
              <button type="submit" class="btn btn-primary">Зберегти</button>
              <button type="button" id="cancel-room-button" class="btn btn-secondary">Скасувати</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped mb-0">
              <thead>
                <tr>
                  <th scope="col">Назва</th>
                  <th scope="col">Опис</th>
                  <th scope="col">Дії</th>
                </tr>
              </thead>
              <tbody id="rooms-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section id="clients" class="section-content d-none">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Пацієнти</h2>
        <button id="new-client-button" class="btn btn-primary">Новий пацієнт</button>
      </div>

      <div id="client-form-container" class="card mb-3 d-none">
        <div class="card-body">
          <form id="client-form" class="row g-3">
            <div class="col-md-4">
              <label for="client-name" class="form-label">Ім'я</label>
              <input type="text" id="client-name" class="form-control" required>
            </div>
            <div class="col-md-5">
              <label for="client-description" class="form-label">Опис</label>
              <input type="text" id="client-description" class="form-control">
            </div>
            <div class="col-md-3 d-flex align-items-end gap-2">
              <button type="submit" class="btn btn-primary">Зберегти</button>
              <button type="button" id="cancel-client-button" class="btn btn-secondary">Скасувати</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-striped mb-0">
              <thead>
                <tr>
                  <th scope="col">Ім'я</th>
                  <th scope="col">Опис</th>
                  <th scope="col">Дії</th>
                </tr>
              </thead>
              <tbody id="clients-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <section id="reservations" class="section-content">
      <h2 class="mb-3">Розміщення</h2>
      <div class="card">
        <div class="card-body">
          <form id="reservation-form" class="row g-3 mb-4">
            <div class="col-md-3">
              <label for="room" class="form-label">Палата</label>
              <select id="room" class="form-select" required>
                <option value="">Виберіть палату</option>
              </select>
            </div>
            <div class="col-md-3">
              <label for="client" class="form-label">Пацієнт</label>
              <select id="client" class="form-select" required>
                <option value="">Виберіть пацієнта</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="date_from" class="form-label">З</label>
              <input type="date" id="date_from" class="form-control" required>
            </div>
            <div class="col-md-2">
              <label for="date_to" class="form-label">До</label>
              <input type="date" id="date_to" class="form-control" required>
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button type="submit" class="btn btn-primary w-100">Зберегти</button>
            </div>
          </form>

          <div class="table-responsive">
            <table class="table table-striped mb-0">
              <thead>
                <tr>
                  <th scope="col">Палата</th>
                  <th scope="col">Пацієнт</th>
                  <th scope="col">З</th>
                  <th scope="col">До</th>
                  <th scope="col">Дії</th>
                </tr>
              </thead>
              <tbody id="reservations-list"></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
